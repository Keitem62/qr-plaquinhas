
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QR Plaquinhas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #17203312;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #586174;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 30px;
      background: #e6f7ed;
      color: #187543;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <span class="status">Projeto em configuração</span>
    <h1>QR Plaquinhas</h1>
    <p>
      Sistema de redirecionamento para plaquinhas
      com QR Code e NFC.
    </p>
    <p>Estamos preparando tudo para funcionar.</p>
  </main>
</body>
</html>
